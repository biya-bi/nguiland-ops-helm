apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ingress-ip-discoverer.fullname" . }}-reader
  namespace: {{ .Values.ingressController.namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - {{ .Values.ingressController.serviceName | quote }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ingress-ip-discoverer.fullname" . }}-reader
  namespace: {{ .Values.ingressController.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ingress-ip-discoverer.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ingress-ip-discoverer.fullname" . }}-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ingress-ip-discoverer.fullname" . }}-writer
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ .Values.configMap.name | quote }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ingress-ip-discoverer.fullname" . }}-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "ingress-ip-discoverer.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ingress-ip-discoverer.fullname" . }}-writer
