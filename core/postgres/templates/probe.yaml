apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-probe
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  is-ready.sh: |-
    #!/bin/bash

    set -eou

    username=`grep -m 1 . ${POSTGRES_USERNAME_FILE}`
    database=`grep -m 1 . ${POSTGRES_DB_FILE}`

    psql -U "${username}" -d "${database}" -c "SELECT 1" --tuples-only

